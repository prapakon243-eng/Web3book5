            <input type="text" id="editNameInput" placeholder="ชื่อผู้ใช้งาน" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-100">

            <div class="flex gap-2 justify-center sm:justify-start">
              <button onclick="saveProfile()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded font-bold">บันทึก</button>
              <button onclick="toggleEditProfile()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs px-3 py-1 rounded">ยกเลิก</button>
            </div>
          </div>
        </div>

        <button id="editProfileBtn" onclick="toggleEditProfile()" class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 px-3 py-1.5 rounded-lg whitespace-nowrap">
          <i class="fa-solid fa-pen-to-square"></i> แก้ไข
        </button>
      </div>

      <!-- 3. ประวัติการซื้อ & ระบบอ่าน/ดาวน์โหลดหนังสือ -->
      <div class="space-y-3">
        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-book-open text-amber-400"></i> ประวัติการซื้อ & หนังสือของฉัน
        </h3>
        
        <div id="purchasedBooksList" class="space-y-2.5">
          <!-- รายการหนังสือจะถูกดึงมาแสดงตรงนี้อัตโนมัติ -->
        </div>
      </div>

    </section>

  <!-- Modal สำหรับอ่านหนังสือออนไลน์ -->

    <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-lg w-full p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h4 id="readerTitle" class="font-bold text-amber-400 text-sm">ชื่อหนังสือ</h4>
        <button onclick="closeReader()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="readerContent" class="text-xs text-slate-300 leading-relaxed max-h-60 overflow-y-auto space-y-2">
        <!-- เนื้อหาหนังสือ -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="w-full border-t border-slate-800 p-4 text-center text-xs text-slate-500 bg-slate-900/50">
    Web3Book Application © 2026 Developed by Prapakon (Prakorn)

    function initMemberSystem() {
      const savedName = localStorage.getItem('w3b_user_name') || 'ท่านแม่ทัพ Prapakon';
      const savedEmail = localStorage.getItem('w3b_user_email') || 'prapakon@web3book.pi';
      
      document.getElementById('displayName').textContent = savedName;
      document.getElementById('displayEmail').textContent = savedEmail;
      document.getElementById('editNameInput').value = savedName;
      document.getElementById('editEmailInput').value = savedEmail;

      renderPurchasedBooks();
    }

    function toggleEditProfile() {
      document.getElementById('profileDisplay').classList.toggle('hidden');
      document.getElementById('profileEditForm').classList.toggle('hidden');
      document.getElementById('editProfileBtn').classList.toggle('hidden');
    }

    function saveProfile() {
      const newName = document.getElementById('editNameInput').value.trim();
      const newEmail = document.getElementById('editEmailInput').value.trim();
      
      if (!newName || !newEmail) {
        alert('กรุณากรอกชื่อและอีเมลให้ครบถ้วนครับ');
        return;
      }

      localStorage.setItem('w3b_user_name', newName);
      localStorage.setItem('w3b_user_email', newEmail);
      
      document.getElementById('displayName').textContent = newName;
      document.getElementById('displayEmail').textContent = newEmail;
      toggleEditProfile();
      alert('อัปเดตข้อมูลโปรไฟล์เรียบร้อยแล้วครับ!');
    }
